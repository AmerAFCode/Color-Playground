<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>

<body>

    <div class="container">
        <h1>🎨 Color Playground</h1>
        <p>Choose a color and change the background!</p>
        <div class="color-buttons">
            <button class="color-btn" data-color="red">Red</button>
            <button class="color-btn" data-color="blue">Blue</button>
            <button class="color-btn" data-color="green">Green</button>
        </div>
        <h2 id="color-display">Current Color: White</h2>
        <div class="timer-buttons">
            <button id="start-btn">Start Color Cycle</button>
            <button id="stop-btn">Stop Color Cycle</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
